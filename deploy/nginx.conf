# Replace results.example.com; install a TLS certificate before enabling this block.
server {
    listen 80;
    server_name results.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name results.example.com;
    ssl_certificate /etc/letsencrypt/live/results.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/results.example.com/privkey.pem;
    client_max_body_size 1m;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # One trusted proxy: overwrite forwarded addresses supplied by clients.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
