<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#101322" />
    <meta
      name="description"
      content="Discover your progress with Exam Result Portal."
    />
    <title>Exam Result Portal</title>
    <link
      rel="preload"
      href="/assets/manrope-latin-variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/loading.css" />
    <link rel="stylesheet" href="/journey.css" />
  </head>
  <body>
    <div class="ambient-background" aria-hidden="true">
      <span></span><span></span>
    </div>
    <div id="app" aria-live="off">
      <section
        class="portal-loader"
        role="status"
        aria-live="polite"
        aria-atomic="true"
        aria-label="Getting things ready"
      >
        <div class="portal-loader-content">
          <div class="portal-loader-art" aria-hidden="true">
            <svg viewBox="0 0 64 72" fill="none">
              <path class="loader-paper" d="M13 5h25l13 13v48H13V5Z" />
              <path class="loader-fold" d="M38 5v14h13" />
              <path class="loader-line" d="M22 31h20M22 40h14M22 49h17" />
              <path class="loader-ascent" d="m34 57 9-9m-9 0h9v9" /></svg
            ><span class="loader-spark"></span>
          </div>
          <p class="portal-loader-brand">Exam Result Portal</p>
          <p class="portal-loader-kicker">STUDENT RESULTS</p>
          <p class="portal-loader-title">Getting things ready</p>
          <p class="portal-loader-description">
            A moment while we open your results portal.
          </p>
          <div class="portal-loader-track" aria-hidden="true">
            <span></span>
          </div>
          <span class="portal-loader-caption" aria-hidden="true"
            >ONE MOMENT</span
          >
        </div>
      </section>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
